; Alembic · versionado del esquema.
;
; La URL NO está aquí. La pone `env.py` desde `DATABASE_MIGRATION_URL` o
; `DATABASE_URL`: una cadena de conexión en un fichero versionado es una
; credencial en el repositorio, y no hay ninguna en este proyecto.

[alembic]
script_location = src/tdd/db/migrations

; Prefijo con fecha: el orden de los ficheros en el listado es el orden real en
; que se aplicaron, que es lo primero que se mira cuando algo va mal.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[project]
name = "tdd-api"
version = "0.1.0"
description = "API de gestión de due diligence técnica inmobiliaria"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "db: prueba que necesita PostgreSQL real (RLS, triggers, restricciones)",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# N818 exige que las excepciones acaben en «Error». El dominio de este proyecto
# está escrito en español —igual que la documentación que revisa el cliente— y
# `TransicionInvalidaError` sería un híbrido peor que cualquiera de los dos.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# En las pruebas, anidar `pytest.raises` y el gestor de sesión por separado se
# lee mejor que combinarlos: deja claro qué se espera que falle.
"tests/**" = ["SIM117"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []

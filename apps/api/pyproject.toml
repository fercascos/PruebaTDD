[project]
name = "tdd-api"
version = "0.1.0"
description = "API de gestión de due diligence técnica inmobiliaria"
requires-python = ">=3.11"
dependencies = [
    # El suelo lo marca `Depends(..., scope="function")`, que es lo que hace que
    # la transacción se confirme ANTES de enviar la respuesta (ver `SesionDep`).
    # 0.141.1 es la versión contra la que se ha comprobado; no se pone un número
    # menor porque no se ha verificado ninguno, y adivinarlo aquí sería fingir
    # una compatibilidad que nadie ha probado.
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    # `email` arrastra `email-validator`, que es lo que valida `EmailStr` en el
    # inicio de sesión. Sin él, la aplicación no arranca.
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    # Fotografías: lectura de EXIF, hash perceptual y derivados.
    "pillow>=10.4",
    # [LIM] HEIC/HEIF es lo que produce un iPhone por defecto. Sin este
    # complemento, Pillow no lo abre y la subida desde el carrete falla.
    "pillow-heif>=0.18",
    # PPTX y XLSX.
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    # Adaptador de almacenamiento S3. Solo se importa si STORAGE_BACKEND=s3:
    # con el adaptador sobre disco la aplicación arranca sin tocarlo.
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    # Construye el EXIF de las imágenes de prueba. [REQ] No hay ni una
    # fotografía real en el repositorio: todas se generan en el momento.
    "piexif>=1.1",
    # Simulador de S3 en proceso. Permite probar el adaptador —incluido que S3
    # rechace borrar una versión retenida— sin credenciales ni red. [LIM] Es un
    # simulador: no demuestra que un bucket concreto esté bien creado.
    "moto[s3]>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "db: prueba que necesita PostgreSQL real (RLS, triggers, restricciones)",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# N818 exige que las excepciones acaben en «Error». El dominio de este proyecto
# está escrito en español —igual que la documentación que revisa el cliente— y
# `TransicionInvalidaError` sería un híbrido peor que cualquiera de los dos.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# En las pruebas, anidar `pytest.raises` y el gestor de sesión por separado se
# lee mejor que combinarlos: deja claro qué se espera que falle.
"tests/**" = ["SIM117"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
# Con `strict`, mypy exige que el paquete se localice como paquete. `src/` no es
# un directorio importable por sí mismo, así que se le dice dónde mirar; sin
# esto la orden correcta era un conjuro que nadie recordaba y el tipado acababa
# sin comprobarse, que es justo lo que pasó.
mypy_path = "src"
packages = ["tdd"]
# `python-pptx` publica `py.typed` pero deja sin anotar media biblioteca:
# `RGBColor(...)`, `fill.solid()`, `Pt(...)`. Con `strict` cada una de esas
# llamadas es un error, y son decenas. Se excluyen **las llamadas a esa
# biblioteca**, no nuestro código: lo nuestro se sigue exigiendo entero.
untyped_calls_exclude = ["pptx"]

# Bibliotecas de terceros **sin tipos**: no publican `py.typed` ni hay stubs
# razonables. No es dejadez nuestra, y el aviso no aporta nada: lo que sí se
# hace es anotar en nuestro lado la frontera con cada una.
[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "fontTools.*",
    "lxml.*",
    "openpyxl.*",
    "pillow_heif.*",
]
ignore_missing_imports = true

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # La API va por el mismo origen: así el navegador no hace preflight de CORS
    # en cada petición y el token no viaja a un origen distinto del de la
    # página. `esg-api` es el nombre del servicio en la red de compose.
    location /api/ {
        proxy_pass http://esg-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un Excel de consumos de una cartera entera pasa de sobra del megabyte
        # por defecto de nginx, y el error que se ve es un 413 sin explicación.
        client_max_body_size 30m;
    }

    location /health {
        proxy_pass http://esg-api:8000/health;
    }

    # Es una SPA: cualquier ruta que no sea un fichero devuelve el index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

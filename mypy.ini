# Tipado de `tools/`, los guiones del repositorio.
#
# La API tiene el suyo en `apps/api/pyproject.toml` y no se toca desde aquí:
# mypy usa la configuración más cercana al fichero, así que `make typecheck`
# ejecuta las dos, cada una sobre lo suyo.
#
# `strict`, igual que la API. Son guiones, no una biblioteca, pero uno de ellos
# —`sembrar_demo.py`— lo ejecuta la CI y es lo que se enseña delante de un
# cliente, y otro —`generar_catalogos.py`— es el que convierte la documentación
# en los catálogos que usa el programa. No son material de usar y tirar.

[mypy]
python_version = 3.11
strict = True
files = tools
# Se lee el código de la API desde su fuente, no desde la instalación editable:
# `pip install -e` deja `tdd` como paquete de espacio de nombres, y entonces
# mypy no ve sus submódulos —«Module "tdd.evidence" has no attribute
# "storage"», con `storage.py` ahí delante—. Es la misma ruta que los guiones se
# meten en `sys.path` al arrancar.
mypy_path = apps/api/src
# `tdd` no tiene `__init__.py`: es un paquete de espacio de nombres. Sin esto,
# mypy trata cada submódulo como algo suelto y `from tdd.evidence import
# storage` da «no tiene atributo storage» con el fichero delante.
namespace_packages = True
explicit_package_bases = True

# `lxml` no publica tipos y sus stubs de terceros (`lxml-stubs`) están a medias
# a propósito: los probamos y añadían 18 errores en los tres guiones que
# reordenan XML de las plantillas, todos del tipo «`.text` puede ser `bytes`» y
# «`find()` puede devolver `None`» en sitios donde el propio documento garantiza
# que no. Aceptarlos habría significado sembrar esos guiones de `assert` y de
# `cast` sin ganar una sola comprobación real. Se deja el módulo sin tipar y se
# dice; lo que los guiones hacen CON lo que devuelve sí se comprueba.
[mypy-lxml.*]
ignore_missing_imports = True
